# ClickHouse server config for Zeus's SigNoz (clickhouse 25.4 topology).
# Single shard/replica cluster named `cluster`, coordinated by the separate
# `zeus-signoz-clickhouse-keeper` container (referenced via the `zookeeper`
# block). Mirror of Capstone's config with zeus- hostnames.
display_name: cluster
listen_host: 0.0.0.0
http_port: 8123
tcp_port: 9000
interserver_http_port: 9009

path: /var/lib/clickhouse/
tmp_path: /var/lib/clickhouse/tmp/
user_files_path: /var/lib/clickhouse/user_files/
user_scripts_path: /var/lib/clickhouse/user_scripts/
format_schema_path: /var/lib/clickhouse/format_schemas/
dictionaries_config: '*_dictionary.xml'

macros:
  shard: "00"
  replica: "00"

remote_servers:
  cluster:
    shard:
      - replica:
          - host: zeus-signoz-clickhouse
            port: 9000

zookeeper:
  node:
    - host: zeus-signoz-clickhouse-keeper
      port: 9181

distributed_ddl:
  path: /clickhouse/task_queue/ddl

# Users are declared inline in this same file (see user_directories below).
# Password is empty: the ClickHouse native port is loopback-bound on the host
# and only reachable by SigNoz services on the pbx-net bridge.
users:
  default:
    password: ""
    networks:
      ip: ::/0
    profile: default
    quota: default
    access_management: 1
    named_collection_control: 1
    show_named_collection: 1
    show_named_collection_secrets: 1

user_directories:
  users_xml:
    path: config.yaml

profiles:
  default:
    load_balancing: random
    log_queries: 1
    allow_simdjson: 0

quotas:
  default:
    interval:
      duration: 3600
      queries: 0
      errors: 0
      result_rows: 0
      read_rows: 0
      execution_time: 0

logger:
  level: information
  console: 1
  size: 1000M
  count: 10
  formatting:
    type: console

# Short-TTL system logs so the local disk doesn't fill up (SigNoz defaults).
asynchronous_metric_log:
  ttl: event_date + INTERVAL 1 DAY DELETE
error_log:
  ttl: event_date + INTERVAL 1 DAY DELETE
latency_log:
  ttl: event_date + INTERVAL 1 DAY DELETE
metric_log:
  flush_interval_milliseconds: 30000
  ttl: event_date + INTERVAL 1 DAY DELETE
part_log:
  ttl: event_date + INTERVAL 1 DAY DELETE
processors_profile_log:
  flush_interval_milliseconds: 30000
  ttl: event_date + INTERVAL 1 DAY DELETE
query_log:
  flush_interval_milliseconds: 30000
  partition_by: toYYYYMM(event_date)
  ttl: event_date + INTERVAL 1 DAY DELETE
query_metric_log:
  ttl: event_date + INTERVAL 1 DAY DELETE
query_thread_log:
  ttl: event_date + INTERVAL 1 DAY DELETE
query_views_log:
  ttl: event_date + INTERVAL 1 DAY DELETE
session_log:
  ttl: event_date + INTERVAL 1 DAY DELETE
text_log:
  flush_interval_milliseconds: 30000
  ttl: event_date + INTERVAL 1 DAY DELETE
trace_log:
  flush_interval_milliseconds: 30000
  ttl: event_date + INTERVAL 1 DAY DELETE
zookeeper_log:
  ttl: event_date + INTERVAL 1 DAY DELETE
