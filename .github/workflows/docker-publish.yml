name: Zeus Docker Build & Publish

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Release tags (v*) are built & published by .github/workflows/release.yml
  # — keep this workflow to master pushes and PR checks so a release never
  # double-builds the 45-90 min full-stack image.
  workflow_dispatch:
  schedule:
    # Weekly check that the full-stack Docker image still builds
    - cron: "0 3 * * 1"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── PR build check (no push) ───────────────────────────────
  build-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build portal image (dry-run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image can start
        run: |
          docker build -t zeus:pr-test .
          docker run --rm -d --name zeus-pr-test -p 3099:3000 \
            -e SESSION_SECRET=pr-test-secret \
            -e VOIPMS_API_USERNAME=test \
            -e VOIPMS_API_PASSWORD=test \
            -e STRIPE_SECRET_KEY=sk_test_demo \
            -e STRIPE_WEBHOOK_SECRET=whsec_demo \
            zeus:pr-test
          sleep 5
          curl -sf -o /dev/null -w '%{http_code}' http://localhost:3099/
          curl -sf http://localhost:3099/api/health || true
          docker rm -f zeus-pr-test

      - name: Validate full-stack compose file
        run: |
          docker compose -f docker-compose.full.yml config -q
          docker compose -f docker-compose.full.yml -f docker-compose.full.build.yml config -q

  # ── Portal-only image (built on every push) ─────────────────
  build-portal:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push portal image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Full-stack image (Asterisk + FreePBX) ──────────────────
  # Pushed to GHCR on every push to master (latest-fullstack tracks master,
  # like the portal image) and on v* releases (versioned tags). The build
  # takes 45-90 min, so a concurrency guard cancels superseded runs and the
  # gha build cache makes the next run resume from the last good layers.
  build-fullstack:
    if: github.event_name == 'release' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      # Separate groups per event so a release build doesn't cancel an
      # in-progress master build (or vice versa).
      group: build-fullstack-${{ github.event_name }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for full stack
        id: meta-full
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-fullstack
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push full-stack image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.full
          push: true
          tags: ${{ steps.meta-full.outputs.tags }}
          labels: ${{ steps.meta-full.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Full-stack install check (no push) ──────────────────────
  # Builds the complete Asterisk + FreePBX image (45-90 min) to verify the
  # full Docker install still works. Triggered manually (workflow_dispatch)
  # or on the weekly schedule — deliberately NOT run on every PR (the
  # build-fullstack job above already covers every push to master).
  build-fullstack-check:
    # Manual (workflow_dispatch) or weekly schedule only — too slow for PRs
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate full-stack compose file
        run: |
          docker compose -f docker-compose.full.yml config -q
          docker compose -f docker-compose.full.yml -f docker-compose.full.build.yml config -q

      - name: Build full-stack image (dry-run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.full
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report build result
        if: always()
        run: echo "Full-stack build finished. Check the logs above for success/failure details."
