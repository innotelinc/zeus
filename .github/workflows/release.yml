# ═══════════════════════════════════════════════════════════════
# release.yml — Zeus release pipeline.
#
# Fires on every `v*` tag push (and on demand via workflow_dispatch):
#   1. build-and-publish — builds and publishes the portal image
#      (Dockerfile) and the full-stack image (Dockerfile.full) to GHCR
#      under the repository's own namespace, tagged with the release
#      version (+ :latest / :latest-fullstack).
#   2. release-artifacts — builds the source bundle + deployment payload
#      and attaches them to the GitHub Release for the pushed tag.
#
# docker-publish.yml handles master pushes (latest/*-fullstack) and PR
# checks; this workflow owns everything that happens on v* tags so a
# release never double-builds.
# ═══════════════════════════════════════════════════════════════
name: Zeus release pipeline

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag to build (e.g. 1.0.0 — without v)"
        required: false
        default: ""

permissions:
  contents: write
  packages: write

concurrency:
  group: zeus-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ── Portal image (fast) ─────────────────────────────────────
  build-portal:
    name: Build & publish portal image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME#v}"
          fi
          [ -n "$TAG" ] || TAG="$(git rev-parse --short HEAD)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push portal image
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          FULL="$REGISTRY/${{ github.repository }}"
          docker build -f Dockerfile -t "$FULL:$IMAGE_TAG" -t "$FULL:latest" .
          docker push "$FULL:$IMAGE_TAG"
          docker push "$FULL:latest"
          echo "::notice::published $FULL:$IMAGE_TAG"

  # ── Full-stack image (45-90 min — runs in parallel with artifacts) ──
  build-fullstack:
    name: Build & publish full-stack image
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME#v}"
          fi
          [ -n "$TAG" ] || TAG="$(git rev-parse --short HEAD)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push full-stack image
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          FULL="$REGISTRY/${{ github.repository }}"
          docker build -f Dockerfile.full -t "$FULL:$IMAGE_TAG-fullstack" -t "$FULL:latest-fullstack" .
          docker push "$FULL:$IMAGE_TAG-fullstack"
          docker push "$FULL:latest-fullstack"
          echo "::notice::published $FULL:$IMAGE_TAG-fullstack"

  # ── Release artifacts ───────────────────────────────────────
  release-artifacts:
    name: Generate release artifacts
    needs: [build-portal]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Build source bundle + deployment payload
        run: ./scripts/build-release-artifacts.sh "$VERSION"

      - name: Attach artifacts to the release
        run: |
          NOTES=$(cat <<NOTESEOF
          Zeus **$VERSION** — generated by the release pipeline.

          **Docker images** (published to GHCR by this run):
          - \`ghcr.io/${{ github.repository }}:$VERSION\` (portal) + \`:latest\`
          - \`ghcr.io/${{ github.repository }}:$VERSION-fullstack\` (Asterisk + FreePBX) + \`:latest-fullstack\`

          **Artifacts**
          - Source bundle (\`zeus-source-bundle.tar.gz\` + checksum)
          - Deployment payload (\`zeus-deployment.tar.gz\` + \`SHA256SUMS\`)
          NOTESEOF
          )
          # The tag already exists (created by the push); create-or-update the
          # release and upload the artifacts onto it.
          gh release create "$VERSION" \
            dist/source-bundle/zeus-source-bundle.tar.gz \
            dist/source-bundle/zeus-source-bundle.tar.gz.sha256 \
            dist/deployment/zeus-deployment.tar.gz \
            dist/deployment/SHA256SUMS \
            --title "Zeus $VERSION" \
            --notes "$NOTES" || \
            gh release upload "$VERSION" \
              dist/source-bundle/zeus-source-bundle.tar.gz \
              dist/source-bundle/zeus-source-bundle.tar.gz.sha256 \
              dist/deployment/zeus-deployment.tar.gz \
              dist/deployment/SHA256SUMS --clobber
          echo "::notice::release artifacts attached to $VERSION"