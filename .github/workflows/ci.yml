# ═══════════════════════════════════════════════════════════════════════════
# ci.yml — static analysis on push and pull requests.
#
# The ShellCheck job runs over every tracked shell script (scripts/*.sh,
# pbx/*.sh, the entrypoint shims, and the .githooks helpers) with bash
# semantics. The repo is maintained at zero findings: intentional patterns
# (dynamic .env source, literal-PHP grep/sed patterns, node -e template
# literals) are documented with inline shellcheck directives, so this job
# fails the build if a commit reintroduces any warning, error, or note.
#
# The Dockerfile RUN bodies get the same treatment: scripts/
# check_dockerfile_runs.py rebuilds each one the way BuildKit does and hands it
# to the shell's own parser, because a broken RUN otherwise costs a full
# 45-90 minute image build to find.
# ═══════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck tracked shell scripts
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh' '.githooks/*')
          echo "Checking ${#scripts[@]} scripts"
          docker run --rm -v "$PWD":/mnt:ro -w /mnt \
            koalaman/shellcheck:v0.10.0 -s bash "${scripts[@]}"

  pbx-converge:
    name: PBX converge tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Unit tests for the per-context dialplan merge tool
        run: python3 -m unittest discover -s pbx/tests -v

      - name: Convergence smoke (zeus fragments are self-stable)
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          touch "$tmp/extensions_custom.conf"
          python3 pbx/asterisk_converge.py --target "$tmp/extensions_custom.conf" \
            --source pbx/asterisk/extensions_custom.conf --owner zeus \
            --append from-internal-custom
          python3 pbx/asterisk_converge.py --target "$tmp/extensions_custom.conf" \
            --source pbx/asterisk/extensions_custom.conf --owner zeus \
            --append from-internal-custom --check

  # Every RUN body, parsed by the shell BuildKit would actually run it with.
  # These break in ways that are invisible on the page — a continuation that
  # drops a newline where one was needed, a function chained into the
  # following `&&` list, a heredoc body read as code — and each one used to
  # cost a 45-90 minute image build to discover.
  dockerfile-runs:
    name: Dockerfile RUN bodies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Unit tests for the RUN-body checker
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Syntax-check every RUN body
        run: python3 scripts/check_dockerfile_runs.py

  # Regression guard: user-facing hosts (landing pages, env templates) must
  # never be localhost or docker bridge IPs — the same bug class that shipped
  # in capstone's .env and dashboard fallback data. Server-side code defaults
  # (src/lib, src/app) are legitimately localhost for local dev and excluded.
  config-guard:
    name: No docker-IP / localhost leaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Landing pages have no docker-bridge IPs or localhost links
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r f; do
            if grep -nE "10\.42\.|172\.(1[6-9]|2[0-9]|3[01])\.|http://localhost:[0-9]+" "$f"; then
              echo "::error file=$f::docker-bridge IP or localhost link in landing page"
              bad=1
            fi
          done < <(git ls-files 'web/**')
          exit $bad

      - name: Env template has no docker-bridge IPs outside comments
        run: |
          set -euo pipefail
          bad=0
          if hits=$(grep -nE '10\.42\.|172\.(1[6-9]|2[0-9]|3[01])\.' <(grep -vE '^\s*#' .env.example)); then
            echo "$hits"
            echo "::error file=.env.example::docker-bridge IP in env template value"
            bad=1
          fi
          exit $bad