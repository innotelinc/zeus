# ═══════════════════════════════════════════════════════════════════════════
# ci.yml — static analysis on push and pull requests.
#
# The ShellCheck job runs over every tracked shell script (scripts/*.sh,
# pbx/*.sh, the entrypoint shims, and the .githooks helpers) with bash
# semantics. The repo is maintained at zero findings: intentional patterns
# (dynamic .env source, literal-PHP grep/sed patterns, node -e template
# literals) are documented with inline shellcheck directives, so this job
# fails the build if a commit reintroduces any warning, error, or note.
# ═══════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck tracked shell scripts
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh' '.githooks/*')
          echo "Checking ${#scripts[@]} scripts"
          docker run --rm -v "$PWD":/mnt:ro -w /mnt \
            koalaman/shellcheck:v0.10.0 -s bash "${scripts[@]}"

  pbx-converge:
    name: PBX converge tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests for the per-context dialplan merge tool
        run: python3 -m unittest discover -s pbx/tests -v

      - name: Convergence smoke (zeus fragments are self-stable)
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          touch "$tmp/extensions_custom.conf"
          python3 pbx/asterisk_converge.py --target "$tmp/extensions_custom.conf" \
            --source pbx/asterisk/extensions_custom.conf --owner zeus \
            --append from-internal-custom
          python3 pbx/asterisk_converge.py --target "$tmp/extensions_custom.conf" \
            --source pbx/asterisk/extensions_custom.conf --owner zeus \
            --append from-internal-custom --check