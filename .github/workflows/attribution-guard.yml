# ═══════════════════════════════════════════════════════════════════════════
# attribution-guard.yml — enforce the attribution policy on every push and PR.
#
# Policy: no credit is given to anyone but Darnel Hunter <dhunter@innotel.us>.
# The guard rejects attribution text (Co-Authored-By/Signed-off-by trailers
# naming anyone else, "Generated with/by <AI tool>", credit lines) in:
#   - commit messages introduced by this push/PR,
#   - the PR title/body (pull requests),
#   - lines added to any file in the push/PR.
#
# The actual patterns live in .githooks/guard-lib (shared with the local
# commit-msg/pre-commit hooks), so this workflow just sources that file and
# feeds it the streams above. It never inspects author/committer identity.
#
# Every run also scans the whole reachable history — messages and every added
# line — so a trailer that entered before the guard existed, or through a
# rewritten branch, cannot sit in the repository unnoticed. Repositories that
# imported history from an upstream (a fork, a vendored tree) cannot hold that
# inherited history to this policy, so they may name the commit before which
# the policy did not exist here in .githooks/attribution-baseline; the scan then
# starts there. The file is per-repository state, not part of the vendored
# guard, so it is deliberately absent from the drift check's file list.
# A self-test step first proves the guard still rejects and allows what it
# must — including that the real pre-commit hook fires — so a silently
# broken guard fails CI instead of passing everything.
# ═══════════════════════════════════════════════════════════════════════════

name: Attribution guard

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
  schedule:
    # Daily, so a history that goes bad without a push (a force-push race, a
    # rewritten ref) is still caught the next morning.
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  guard:
    name: Check attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard self-test (the guard must still fire)
        run: |
          source .githooks/guard-lib
          guard_selftest --self-commit
          echo "guard self-test passed"

      - name: Check commit messages, PR text, and file changes
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -uo pipefail
          source .githooks/guard-lib

          fail=0

          # ── Tag pushes introduce no new history ───────────────────────
          # A tag push carries an all-zero "before" SHA (like a brand-new
          # repo), but the tag itself adds only the tagged commit. Scan the
          # tag's own commit message + diff instead of the full history, so
          # historical trailers never block a release.
          if [ "${REF_TYPE:-}" = "tag" ]; then
            git log -1 --format=%B "${GITHUB_REF_NAME}" | guard_check_stream || fail=1
            added="$(git show --format= --no-color -U0 "${GITHUB_REF_NAME}" -- . 2>/dev/null | grep '^+' | grep -v '^+++' | sed 's/^+//' || true)"
            if [ -n "$added" ]; then
              printf '%s\n' "$added" | guard_check_stream || fail=1
            fi
            if [ "$fail" -ne 0 ]; then
              echo "::error::Attribution guard failed — only Darnel Hunter <dhunter@innotel.us> may be credited."
              exit 1
            fi
            echo "attribution guard: clean"
            exit 0
          fi

          # ── Determine the commit range to scan ─────────────────────────
          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
            base="${PR_BASE:-}"; head="${PR_HEAD:-}"
          else
            base="${BASE_SHA:-}"; head="${HEAD_SHA:-}"
          fi
          # A brand-new branch/repo pushes with an all-zero "before" SHA —
          # in that case scan the full reachable history instead.
          if [ -n "$base" ] && printf '%s' "$base" | grep -Eq '^0+$'; then
            base=""
          fi

          # ── 1. Commit messages in the range ───────────────────────────
          if [ -n "$base" ] && [ -n "$head" ]; then
            # The "before" SHA must not only resolve but be an ancestor of the
            # pushed head: a force-push leaves it unreachable (history was
            # rewritten), and even where the object still resolves, `git log
            # base..head` then dies with "Invalid revision range" — which
            # `pipefail` reads as a guard failure. Requiring ancestry sends that
            # case to the head-only scan instead, mirroring the tag-push path.
            if git rev-parse --verify --quiet "${base}^{commit}" >/dev/null 2>&1 \
               && git merge-base --is-ancestor "${base}" "${head}" >/dev/null 2>&1; then
              git log --format=%B "${base}..${head}" | guard_check_stream || fail=1
            else
              git log -1 --format=%B "$head" | guard_check_stream || fail=1
            fi
          else
            git log --format=%B | guard_check_stream || fail=1
          fi

          # ── 2. PR title + body (content check only) ───────────────────
          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
            { printf '%s\n' "${PR_TITLE:-}"; printf '%s\n' "${PR_BODY:-}"; } | guard_check_stream || fail=1
          fi

          # ── 3. Lines added to files in the push/PR ────────────────────
          # The '+' diff marker is stripped after filtering: the trailer rule
          # is anchored (^), so a leading '+' would hide foreign credit lines
          # from the scan.
          added=""
          if [ -n "$base" ] && [ -n "$head" ]; then
            if git rev-parse --verify --quiet "${base}^{commit}" >/dev/null 2>&1 \
               && git merge-base --is-ancestor "${base}" "${head}" >/dev/null 2>&1; then
              added="$(git diff --no-color -U0 "$base" "$head" -- . 2>/dev/null | grep '^+' | grep -v '^+++' | sed 's/^+//' || true)"
            else
              added="$(git show --format= --no-color -U0 "$head" -- . 2>/dev/null | grep '^+' | grep -v '^+++' | sed 's/^+//' || true)"
            fi
          else
            added="$(git log -p --format= --no-color HEAD 2>/dev/null | grep '^+' | grep -v '^+++' | sed 's/^+//' || true)"
          fi
          if [ -n "$added" ]; then
            printf '%s\n' "$added" | guard_check_stream || fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::Attribution guard failed — only Darnel Hunter <dhunter@innotel.us> may be credited."
            exit 1
          fi
          echo "attribution guard: clean"

      # ── The whole repository, not just this event ─────────────────────────
      # The step above checks what this push or pull request introduced. This
      # one holds every commit the default branch can reach to the same policy,
      # so "all commits" means all of them: an old message, or a line added to a
      # file years ago, fails the build until history is rewritten.
      - name: Check the entire history
        run: |
          set -uo pipefail
          source .githooks/guard-lib
          fail=0

          # Where the repository imported history it does not own — a fork of an
          # upstream, a vendored tree — a trailer in those commits is not this
          # repository's to rewrite, and a future upstream sync would bring it
          # back. Such a repository names the commit before which the policy did
          # not exist here; every commit after it is checked.
          range=HEAD
          if [ -s .githooks/attribution-baseline ]; then
            baseline="$(head -n 1 .githooks/attribution-baseline | tr -d '[:space:]')"
            if ! git cat-file -e "${baseline}^{commit}" 2>/dev/null; then
              echo "::error::.githooks/attribution-baseline names ${baseline}, which this checkout does not contain"
              exit 1
            fi
            range="${baseline}..HEAD"
          fi

          git log --format=%B "$range" | guard_check_stream || fail=1

          added="$(git log -p --format= --no-color "$range" | grep '^+' | grep -v '^+++' | sed 's/^+//' || true)"
          if [ -n "$added" ]; then
            printf '%s\n' "$added" | guard_check_stream || fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::Attribution guard failed on history — only Darnel Hunter <dhunter@innotel.us> may be credited. Rewrite the offending commits."
            exit 1
          fi
          echo "attribution guard: full history clean"
