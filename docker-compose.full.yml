# ═══════════════════════════════════════════════════════════════
# Zeus — VOIP Platform Full Stack Docker Compose
# ═══════════════════════════════════════════════════════════════
# Deploys the complete VoIP infrastructure:
#   Asterisk 22.11 + FreePBX 17 + AvantFax + Zeus Portal
#
# Prerequisites:
#   1. Configure your env vars:
#      cp .env.docker.example .env   # then fill in real values
#   2. Start the stack — the Asterisk/FreePBX image is pulled from GHCR
#      (ghcr.io/innotelinc/zeus:latest-fullstack, published by the
#      GitHub Actions release workflow on every push to master). To build it
#      locally instead (dev/offline), add the build override:
#      docker compose -f docker-compose.full.yml -f docker-compose.full.build.yml up -d
#
# Ports exposed:
#   80        FreePBX web UI
#   3000      Zeus Customer Portal (Next.js)
#   5060/udp  SIP signalling
#   5038      Asterisk AMI
#   8080      AvantFax web UI
#   8088      Asterisk HTTP (ARI)
#   8089      PJSIP WebSocket (WSS) for WebRTC
#   10000     Webmin admin panel
#   10101-10120/udp  RTP media (matches the capstone shared-PBX convention)
# ═══════════════════════════════════════════════════════════════

services:
  # ── Asterisk + FreePBX 17 ──────────────────────────────────
  # The full-stack image bundles its own MariaDB (the entrypoint runs
  # `service mariadb start`), so no external database service is needed.
  freepbx:
    # Pre-built image published to GHCR by .github/workflows/docker-publish.yml
    # (latest-fullstack tracks master; semver tags on releases). Pulled on the
    # first `up` — no 45-90 min local build needed.
    #   - Refresh after a newer build:   docker compose pull freepbx
    #   - Build locally instead (dev/offline): use the build override
    #     docker compose -f docker-compose.full.yml -f docker-compose.full.build.yml up -d
    # No pull_policy set — the default (`missing`) pulls only when the image
    # is not present locally. The build override below relies on that default
    # to build instead of pull on offline servers.
    image: ghcr.io/innotelinc/zeus:latest-fullstack
    container_name: zeus-freepbx
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined
    ports:
      - "80:80"            # FreePBX web UI
      # The same UI on 8083 — the port the bundled add-on FreePBX published and
      # the one docs/networking.md + any existing `pbx.<domain>` proxy host
      # point at, so taking the voice plane over does not move the GUI out from
      # under the operator. Both map container :80.
      - "8083:80"
      - "5060:5060/udp"   # SIP
      - "5061:5061/tcp"   # SIP TLS
      - "8088:8088"       # Asterisk HTTP (plain WebSocket for NPM)
      - "8089:8089"       # PJSIP WebSocket (WSS)
      - "5038:5038"       # Asterisk AMI
      - "10000:10000"     # Webmin admin panel
      # RTP media — the SAME range Capstone publishes, because both products
      # ride one RTP plane on a shared box. The host side is env-driven so an
      # install whose 10101-10120 is busy can shift the block; the container
      # side stays fixed at 10101-10120 (what Asterisk binds), so the two sides
      # must stay the same length. Keep Webmin (TCP 10000) out of the range.
      # docker-entrypoint-full.sh writes the matching rtpstart/rtpend into both
      # rtp_custom.conf and FreePBX's kvstore_Sipsettings — all three must agree.
      - "${FREEPBX_RTP_PORT_START:-10101}-${FREEPBX_RTP_PORT_END:-10120}:10101-10120/udp"
    environment:
      # Becomes the self-signed WebRTC cert CN (docker-entrypoint-full.sh). On a
      # box that already ran the PBX under another name, pin it in .env to that
      # existing identity — renaming it rewrites the cert, not the SIP domain.
      HOSTNAME: ${HOSTNAME:-pbx.zeus.innotel.us}
      # VoIP.ms SIP trunk auto-configuration
      VOIPMS_SIP_USER: ${VOIPMS_SIP_USER:-}
      VOIPMS_SIP_PASS: ${VOIPMS_SIP_PASS:-}
      VOIPMS_SIP_SERVER: ${VOIPMS_SIP_SERVER:-newyork1.voip.ms}
      VOIPMS_MAIN_ACCOUNT: ${VOIPMS_MAIN_ACCOUNT:-}
      # AMI credentials
      FREEPBX_AMI_USER: ${FREEPBX_AMI_USER:-pbxportal}
      FREEPBX_AMI_SECRET: ${FREEPBX_AMI_SECRET:-}
      # Password for the FreePBX MariaDB user, needed only when this container
      # runs against a pbx-mariadb-data volume another image created (see
      # .env.docker.example). docker-entrypoint-full.sh reconciles
      # /etc/freepbx.conf and the MariaDB grant to it, leaving the volume's own
      # credentials alone so the stack hand-off stays reversible.
      PBX_DB_PASS: ${PBX_DB_PASS:-}
      # OAuth2 API client
      FREEPBX_CLIENT_ID: ${FREEPBX_CLIENT_ID:-pbxportal-api}
      FREEPBX_CLIENT_SECRET: ${FREEPBX_CLIENT_SECRET:-}
      # SMTP for voicemail-to-email
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-pbx@zeus.innotel.us}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      # Asterisk watchdog (see docker-entrypoint-full.sh) — self-heals
      # a dropped control socket by running `fwconsole reload`.
      ASTERISK_WATCHDOG_INTERVAL: ${ASTERISK_WATCHDOG_INTERVAL:-30}
      ASTERISK_WATCHDOG_COOLDOWN: ${ASTERISK_WATCHDOG_COOLDOWN:-60}
      # RTP plane (docker-entrypoint-full.sh -> write_rtp_plane). Asterisk binds
      # exactly this range; the entrypoint caps rtp_custom.conf with it AND
      # writes it into FreePBX's kvstore_Sipsettings (which is what regenerates
      # rtp_additional.conf on Apply Config), so it must match the published
      # mapping above. Same env names/defaults as the Capstone stack.
      FREEPBX_RTP_PORT_START: ${FREEPBX_RTP_PORT_START:-10101}
      FREEPBX_RTP_PORT_END: ${FREEPBX_RTP_PORT_END:-10120}
      # STUN/TURN address for Asterisk's RTP engine. Empty -> the local `coturn`
      # compose service (resolves on pbx-net as coturn:<TURN_LISTENING_PORT>).
      # Set it (e.g. the LAN IP, or 127.0.0.1 on bare metal) when the alias is
      # not resolvable — do NOT use host.docker.internal, ast_sockaddr_resolve
      # fails on it and silently disables STUN.
      PJSIP_STUN_TURN_ADDR: ${PJSIP_STUN_TURN_ADDR:-}
      TURN_LISTENING_PORT: ${TURN_LISTENING_PORT:-3478}
      # TURN credentials, written into FreePBX's settings DB by the entrypoint so
      # Asterisk, coturn and the portals' browsers all authenticate with one
      # pair (see docker-entrypoint-full.sh → write_turn_plane).
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
      # Public STUN/TURN name for the *WebRTC* rows only — browsers cannot
      # resolve the internal compose name that Asterisk's own ICE uses.
      TURN_PUBLIC_ADDR: ${TURN_PUBLIC_ADDR:-coturn.zeus.innotel.us}
    volumes:
      - asterisk-config:/etc/asterisk
      - asterisk-sounds:/var/lib/asterisk/sounds
      - asterisk-spool:/var/spool/asterisk
      # Asterisk's log dir on a named volume so host-side fail2ban can read the
      # rejected-registration records straight off disk (scripts/install-fail2ban.sh,
      # pbx/fail2ban/). See pbx/README.md → "Blocking invalid SIP registrations".
      - asterisk-logs:/var/log/asterisk
      - freepbx-www:/var/www/html
      # MS Teams Direct Routing tooling (pbx/cerulean-msteams.sh + the
      # vendored wizard) — mounted read-only so the SBC bring-up can run
      # inside this container (see pbx/README.md → Docker deployment).
      - ./pbx:/opt/zeus/pbx:ro
      # Persist MariaDB so the FreePBX module registry can't drift from the
      # freepbx-www volume across container recreates (a fresh DB would reset
      # module versions and re-trigger the disabled-module / "Unknown Error"
      # failure after the boot-time `fwconsole ma refreshsignatures`).
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - pbx-net

  # ── AvantFax (fax web UI) ──────────────────────────────────
  # Shares the freepbx image — AvantFax runs inside the same container
  # via PHP 7.4 FPM and Apache at /fax. This service is just an alias
  # so the portal can resolve 'avantfax' as a hostname.
  # The actual fax UI is at http://freepbx/fax (port 80).
  # For external access, use the HOSTNAME:80/fax path.

  # ── Zeus Customer Portal (Next.js) ─────────────────────────
  portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zeus-portal
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined
    depends_on:
      - freepbx
    ports:
      # Host 3001 (container 3000): matches docker-compose.yml so the full
      # stack stays off the shared :3000 owned by the Signara frontend.
      - "3001:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Next binds to $HOSTNAME (set to the public IP in .env, or injected by
      # Docker as the container id) — pin it so the server listens on all
      # local interfaces (0.0.0.0) instead of failing with EADDRNOTAVAIL.
      HOSTNAME: "0.0.0.0"

      # ── Session ──
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_SECURE: ${SESSION_SECURE:-false}
      SESSION_SAMESITE: ${SESSION_SAMESITE:-lax}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-}

      # ── Auth mode ──
      # "authentik" = SSO only · "freepbx" = local password auth only ·
      # "both" = Authentik button + password form. Default: "authentik"
      # when the AUTHENTIK_* OIDC vars are set, "freepbx" otherwise.
      AUTH_MODE: ${AUTH_MODE:-}

      # ── VoIP.ms ──
      VOIPMS_API_USERNAME: ${VOIPMS_API_USERNAME:-}
      VOIPMS_API_PASSWORD: ${VOIPMS_API_PASSWORD:-}
      VOIPMS_WEBHOOK_SECRET: ${VOIPMS_WEBHOOK_SECRET:-}
      VOIPMS_SIP_USER: ${VOIPMS_SIP_USER:-}
      VOIPMS_SIP_PASS: ${VOIPMS_SIP_PASS:-}
      VOIPMS_SIP_SERVER: ${VOIPMS_SIP_SERVER:-newyork1.voip.ms}
      VOIPMS_MAIN_ACCOUNT: ${VOIPMS_MAIN_ACCOUNT:-}

      # ── FreePBX (internal Docker network) ──
      FREEPBX_URL: http://freepbx
      FREEPBX_CLIENT_ID: ${FREEPBX_CLIENT_ID:-pbxportal-api}
      FREEPBX_CLIENT_SECRET: ${FREEPBX_CLIENT_SECRET:-}

      # ── Asterisk AMI ──
      ASTERISK_AMI_HOST: freepbx
      ASTERISK_AMI_PORT: "5038"
      ASTERISK_AMI_USERNAME: ${FREEPBX_AMI_USER:-pbxportal}
      ASTERISK_AMI_SECRET: ${FREEPBX_AMI_SECRET:-}

      # ── WebRTC / TURN ──
      # WSS URL for softphone: use dedicated ws.zeus.innotel.us hostname by default.
      # Override via FREEPBX_WSS_HOST env var (e.g. pbx.zeus.innotel.us or an IP).
      NEXT_PUBLIC_FREEPBX_WSS_URL: wss://${FREEPBX_WSS_HOST:-ws.zeus.innotel.us}:8089/ws
      NEXT_PUBLIC_TURN_SERVER: ${TURN_SERVER:-}
      NEXT_PUBLIC_TURN_USERNAME: ${TURN_USERNAME:-}
      NEXT_PUBLIC_TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}

      # ── AvantFax (runs inside freepbx container at /fax) ──
      AVANTFAX_URL: http://freepbx/fax
      NEXT_PUBLIC_AVANTFAX_URL: http://${HOSTNAME:-fax.zeus.innotel.us}/fax

      # ── Atlas integration ──
      ATLAS_API_URL: ${ATLAS_API_URL:-http://atlas-server:3000}
      ATLAS_API_KEY: ${ATLAS_API_KEY:-}

      # ── Stripe billing (LEGACY — Magnate owns billing) ──
      # Leave STRIPE_* empty when Magnate is the billing platform.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CONSUMER_PRICE_ID: ${STRIPE_CONSUMER_PRICE_ID:-}
      STRIPE_BUSINESS_PRICE_ID: ${STRIPE_BUSINESS_PRICE_ID:-}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      # Magnate (RevenueOps) — source billing platform for all projects.
      MAGNATE_PUBLIC_URL: ${MAGNATE_PUBLIC_URL:-}

      # ── Email (SMTP for voicemail/invoice/fax notifications) ──
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@zeus.innotel.us}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-pbx@zeus.innotel.us}
      SMTP_SECURE: ${SMTP_SECURE:-false}

      # ── Public URL ──
      NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL:-https://app.zeus.innotel.us}
    volumes:
      - portal-data:/app/data
      - asterisk-config:/etc/asterisk:rw
    healthcheck:
      # No `-f`: the health endpoint returns 503 when >=2 external services
      # (FreePBX/VoIP.ms/Stripe) are down. The container is healthy as long as
      # the portal itself responds — any HTTP response counts; only transport
      # errors (connection refused/timeout) fail the check.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    networks:
      - pbx-net

  # ── Coturn TURN server for WebRTC NAT traversal (enabled by default) ──
  # Realm/credentials come from .env (TURN_USERNAME/TURN_CREDENTIAL/
  # TURN_REALM/TURN_EXTERNAL_IP); the softphone advertises the public
  # address coturn.zeus.innotel.us (DNS CNAME + edge proxy).
  coturn:
    image: coturn/coturn:latest
    container_name: pbx-coturn
    restart: unless-stopped
    # NB: only flags this image's turnserver actually accepts. `--no-dtls` is
    # rejected outright ("unrecognized option") and `--no-cli` is deprecated in
    # favour of `--cli`, so both made the container exit 255 in a restart loop
    # the first time anyone ran `docker compose up coturn`.
    command:
      - turnserver
      - --no-tls
      - --fingerprint
      - --lt-cred-mech
      - --user=${TURN_USERNAME:-turnuser}:${TURN_CREDENTIAL:?set TURN_CREDENTIAL in .env}
      - --realm=${TURN_REALM:-zeus.innotel.us}
      - --listening-port=3478
      - --min-port=${TURN_RELAY_PORT_START:-49152}
      - --max-port=${TURN_RELAY_PORT_END:-49251}
      - --listening-ip=0.0.0.0
      # Public address coturn advertises for relayed candidates. It sits behind
      # Docker NAT and cannot discover this itself. The coturn image eval()s
      # each argument and ships detect-external-ip (a DNS probe returning the
      # caller's public IP), so a changing WAN IP is tracked on every start —
      # which matters here: 73.68.203.71 is residential, and a pinned address
      # rots into relay candidates nobody can reach (calls connect, no audio).
      # Pin TURN_EXTERNAL_IP in .env only where that probe is blocked. Same
      # expression as the Capstone coturn service, so handing the voice plane
      # back changes nothing.
      - --external-ip=${TURN_EXTERNAL_IP:-$(detect-external-ip)}
      - --log-file=stdout
      - --simple-log
    ports:
      - "${TURN_LISTENING_PORT:-3478}:3478"
      - "${TURN_LISTENING_PORT:-3478}:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
      # The relay range has to be published: 3478 alone only carries the TURN
      # control channel. Relayed media is delivered to a relayed transport
      # address inside 49152-49251, so without this mapping every peer outside
      # pbx-net — i.e. every real browser — sends into a closed port and calls
      # are silent. Capstone published it; this service initially did not, so
      # the relay went dark the moment Zeus took over port 3478.
      - "${TURN_RELAY_PORT_START:-49152}-${TURN_RELAY_PORT_END:-49251}:${TURN_RELAY_PORT_START:-49152}-${TURN_RELAY_PORT_END:-49251}/udp"
    # The image ships bash but no curl/wget/python, so a raw TCP connect is the
    # proof the TURN listener is up — a dead relay then shows in `compose ps`
    # instead of being discovered by a silent user.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3478' || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - pbx-net

# ── Shared voice-plane volumes (the pbx-* names) ──────────────────────────
# Identical to the volumes the Capstone agent add-on declares (external,
# name: pbx-*), so both products reference ONE data plane instead of copying
# between two: extensions, routes, CDRs, voicemail, Asterisk config and the
# FreePBX web root are the same for whichever stack is running. Handing the
# voice plane back to the bundled add-on FreePBX therefore needs no data
# movement at all — only a container swap.
#
# `external` is deliberate: the data must outlive either project (Docker
# refuses to let a compose file own a volume another project is using), and
# `scripts/setup.sh` creates the names on a fresh host. See the Capstone repo
# docs/zeus-integration.md ("one shared PBX") for the ownership contract.
volumes:
  asterisk-config:
    name: pbx-asterisk-config
    external: true
  asterisk-sounds:
    name: pbx-asterisk-sounds
    external: true
  asterisk-spool:
    name: pbx-asterisk-spool
    external: true
  # Read by host-side fail2ban; PBX writes its security channel here.
  asterisk-logs:
    name: pbx-asterisk-logs
    external: true
  freepbx-www:
    name: pbx-freepbx-www
    external: true
  mariadb-data:
    name: pbx-mariadb-data
    external: true
  # Zeus's own portal state — not part of the shared voice plane.
  portal-data:
    name: zeus-portal-data

networks:
  pbx-net:
    name: pbx-net
