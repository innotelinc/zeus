# ═══════════════════════════════════════════════════════════════
# Innotel PBX — Full Stack Docker Compose
# ═══════════════════════════════════════════════════════════════
# Deploys the complete VoIP infrastructure:
#   Asterisk 22.9 + FreePBX 17 + AvantFax + PBX Portal
#
# Prerequisites:
#   1. Build the Asterisk/FreePBX base image:
#      docker build -f Dockerfile.full -t innotel/freepbx .
#   2. Configure your env vars:
#      cp .env.docker.example .env   # then fill in real values
#   3. Start the stack:
#      docker compose -f docker-compose.full.yml up -d
#
# Ports exposed:
#   80        FreePBX web UI
#   3000      PBX Customer Portal (Next.js)
#   5060/udp  SIP signalling
#   5038      Asterisk AMI
#   8080      AvantFax web UI
#   8088      Asterisk HTTP (ARI)
#   8089      PJSIP WebSocket (WSS) for WebRTC
#   10000:20000/udp  RTP media
# ═══════════════════════════════════════════════════════════════

services:
  # ── MariaDB (shared database) ──────────────────────────────
  mariadb:
    image: mariadb:10.11
    container_name: pbx-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASS:-DD@l1lama}
      MARIADB_DATABASE: asterisk
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pbx-net

  # ── Asterisk + FreePBX 17 ──────────────────────────────────
  freepbx:
    image: innotel/freepbx:latest
    container_name: pbx-freepbx
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "80:80"           # FreePBX web UI
      - "5060:5060/udp"   # SIP
      - "5061:5061/tcp"   # SIP TLS
      - "8088:8088"       # Asterisk HTTP (ARI)
      - "8089:8089"       # PJSIP WebSocket (WSS)
      - "5038:5038"       # Asterisk AMI
      - "10000:20000/udp" # RTP
    environment:
      DB_HOST: mariadb
      DB_PASS: ${DB_PASS:-DD@l1lama}
      HOSTNAME: ${HOSTNAME:-voice.innotel.us}
      # VoIP.ms SIP trunk auto-configuration
      VOIPMS_SIP_USER: ${VOIPMS_SIP_USER:-}
      VOIPMS_SIP_PASS: ${VOIPMS_SIP_PASS:-}
      VOIPMS_SIP_SERVER: ${VOIPMS_SIP_SERVER:-newyork1.voip.ms}
      VOIPMS_MAIN_ACCOUNT: ${VOIPMS_MAIN_ACCOUNT:-}
      # AMI credentials
      FREEPBX_AMI_USER: ${FREEPBX_AMI_USER:-pbxportal}
      FREEPBX_AMI_SECRET: ${FREEPBX_AMI_SECRET:-}
      # OAuth2 API client
      FREEPBX_CLIENT_ID: ${FREEPBX_CLIENT_ID:-pbxportal-api}
      FREEPBX_CLIENT_SECRET: ${FREEPBX_CLIENT_SECRET:-}
      # SMTP for voicemail-to-email
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-pbx@innotel.us}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    volumes:
      - asterisk-config:/etc/asterisk
      - asterisk-sounds:/var/lib/asterisk/sounds
      - asterisk-spool:/var/spool/asterisk
      - freepbx-www:/var/www/html
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - pbx-net

  # ── AvantFax (fax web UI) ──────────────────────────────────
  avantfax:
    image: innotel/avantfax:latest
    container_name: pbx-avantfax
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mariadb
      DB_PASS: ${DB_PASS:-DD@l1lama}
      FAX_EMAIL: ${FAX_EMAIL:-fax@innotel.us}
      FAX_NUMBER: ${FAX_NUMBER:-7745057136}
      SMTP_HOST: ${SMTP_HOST:-mail.innotel.us}
    volumes:
      - avantfax-faxes:/var/www/html/fax/faxes
      - hylafax-spool:/var/spool/hylafax
    networks:
      - pbx-net

  # ── PBX Customer Portal (Next.js) ──────────────────────────
  portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pbx-portal
    restart: unless-stopped
    depends_on:
      freepbx:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"

      # ── Session ──
      SESSION_SECRET: ${SESSION_SECRET:-}

      # ── VoIP.ms ──
      VOIPMS_API_USERNAME: ${VOIPMS_API_USERNAME:-}
      VOIPMS_API_PASSWORD: ${VOIPMS_API_PASSWORD:-}
      VOIPMS_WEBHOOK_SECRET: ${VOIPMS_WEBHOOK_SECRET:-}
      VOIPMS_SIP_USER: ${VOIPMS_SIP_USER:-}
      VOIPMS_SIP_PASS: ${VOIPMS_SIP_PASS:-}
      VOIPMS_SIP_SERVER: ${VOIPMS_SIP_SERVER:-newyork1.voip.ms}
      VOIPMS_MAIN_ACCOUNT: ${VOIPMS_MAIN_ACCOUNT:-}

      # ── FreePBX (internal Docker network) ──
      FREEPBX_URL: http://freepbx
      FREEPBX_CLIENT_ID: ${FREEPBX_CLIENT_ID:-pbxportal-api}
      FREEPBX_CLIENT_SECRET: ${FREEPBX_CLIENT_SECRET:-}

      # ── Asterisk AMI ──
      ASTERISK_AMI_HOST: freepbx
      ASTERISK_AMI_PORT: "5038"
      ASTERISK_AMI_USERNAME: ${FREEPBX_AMI_USER:-pbxportal}
      ASTERISK_AMI_SECRET: ${FREEPBX_AMI_SECRET:-}

      # ── WebRTC / TURN ──
      NEXT_PUBLIC_FREEPBX_WSS_URL: wss://${HOSTNAME:-voice.innotel.us}:8089/ws
      NEXT_PUBLIC_TURN_SERVER: ${TURN_SERVER:-}
      NEXT_PUBLIC_TURN_USERNAME: ${TURN_USERNAME:-}
      NEXT_PUBLIC_TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}

      # ── AvantFax ──
      AVANTFAX_URL: http://avantfax:8080/avantfax
      NEXT_PUBLIC_AVANTFAX_URL: http://${HOSTNAME:-voice.innotel.us}:8080/avantfax

      # ── Atlas integration ──
      ATLAS_API_URL: ${ATLAS_API_URL:-http://atlas-server:3000}
      ATLAS_API_KEY: ${ATLAS_API_KEY:-}

      # ── Stripe billing ──
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CONSUMER_PRICE_ID: ${STRIPE_CONSUMER_PRICE_ID:-}
      STRIPE_BUSINESS_PRICE_ID: ${STRIPE_BUSINESS_PRICE_ID:-}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}

      # ── Email (SMTP for voicemail/invoice/fax notifications) ──
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@innotel.us}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-pbx@innotel.us}
      SMTP_SECURE: ${SMTP_SECURE:-false}

      # ── Public URL ──
      NEXT_PUBLIC_URL: https://${HOSTNAME:-voice.innotel.us}:3000
    volumes:
      - portal-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - pbx-net

  # ─── Optional: Coturn TURN server for WebRTC NAT traversal ──
  # Uncomment and set TURN_SERVER=turn:pbx-coturn:3478 in .env
  # coturn:
  #   image: coturn/coturn:latest
  #   container_name: pbx-coturn
  #   restart: unless-stopped
  #   ports:
  #     - "3478:3478"
  #     - "3478:3478/udp"
  #     - "5349:5349"
  #     - "5349:5349/udp"
  #   volumes:
  #     - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
  #   networks:
  #     - pbx-net

volumes:
  mariadb-data:
    name: pbx-mariadb-data
  asterisk-config:
    name: pbx-asterisk-config
  asterisk-sounds:
    name: pbx-asterisk-sounds
  asterisk-spool:
    name: pbx-asterisk-spool
  freepbx-www:
    name: pbx-freepbx-www
  avantfax-faxes:
    name: pbx-avantfax-faxes
  hylafax-spool:
    name: pbx-hylafax-spool
  portal-data:
    name: pbx-portal-data

networks:
  pbx-net:
    name: pbx-net
