; ═══════════════════════════════════════════════════════════════════
; Zeus — SMS contexts for the VoIP.ms PJSIP trunk
;
; These are the contexts `scripts/setup.sh` wrote on **bare metal** and nowhere
; else, so a containerised estate had the trunk `Registered` and no dialplan to
; put a MESSAGE on: a softphone could hand Asterisk a text and there was nowhere
; for it to go (docs/ops-sms-trunk.md).
;
; They are not applied as a file of their own. `pbx/bootstrap-zeus-pbx.sh` passes
; this fragment as a second `--source` to the same `extensions_custom.conf`
; converge it already runs, so the contexts merge in beside the portal's — and
; only when the trunk is configured to build a sender, which is why the whole
; file is skipped when VOIPMS_SIP_USER or VOIPMS_SIP_SERVER is unset: a context
; whose From URI names no sub-account is worse than an absent one, and it is
; inert here either way (nothing in FreePBX reaches it by itself).
;
; `__SMS_IN_CONTEXT__` / `__SMS_OUT_CONTEXT__` are the operator's own names
; (SMS_IN_CONTEXT / SMS_OUT_CONTEXT, default sms-in / sms-out) — the portal's
; smoke scope reads the same variable, so the assertion and the dialplan cannot
; drift apart.
;
; `sms-out` is the **softphone** path: a registered phone hands Asterisk a
; MESSAGE and this builds the outbound one. The portal itself does not route
; through it — its AMI `MessageSend` names the To/From URIs directly
; (`src/lib/sms.ts`) — which is why `./scripts/smoke-test.sh` asserts this
; context only when SMS_OUT_CONTEXT is set.
; ═══════════════════════════════════════════════════════════════════

; ── Inbound SMS, delivered to Asterisk ────────────────────────────────
; Reached when the trunk hands Asterisk a MESSAGE out of a dialog
; (`outofcall_message_context` in the PJSIP `[general]` block): it is relayed to
; the endpoint the number names, as setup.sh's trunk-linked half always did.
[__SMS_IN_CONTEXT__]
exten => _.,1,NoOp(Inbound SMS dialplan invoked)
 same => n,NoOp(To ${MESSAGE(to)})
 same => n,NoOp(From ${MESSAGE(from)})
 same => n,NoOp(Body ${MESSAGE(body)})
 same => n,Set(NUMBER_TO=${MESSAGE_DATA(X-SMS-To)})
 same => n,Set(HOST_TO=${CUT(MESSAGE(to),@,2)})
 same => n,Set(ACTUAL_FROM=${MESSAGE(from)})
 same => n,Set(ACTUAL_TO=pjsip:${NUMBER_TO}@${HOST_TO})
 same => n,MessageSend(${ACTUAL_TO},${ACTUAL_FROM})
 same => n,NoOp(Send status is ${MESSAGE_SEND_STATUS})
 same => n,Hangup()

; ── Outbound SMS, built by a phone ───────────────────────────────────
; `To` is normalised to bare digits and addressed at the trunk endpoint named in
; VOIPMS_TRUNK_NAME (`pjsip:<trunk>/sip:<n>@<host>`), with the extension as the
; display name and the trunk sub-account as the From user — the same shape
; `src/lib/sms.ts` builds for the portal's own sends.
[__SMS_OUT_CONTEXT__]
exten => _.,1,NoOp(Outbound Message dialplan invoked)
 same => n,NoOp(To ${MESSAGE(to)})
 same => n,NoOp(From ${MESSAGE(from)})
 same => n,NoOp(Body ${MESSAGE(body)})
 same => n,Set(NUMBER_TO=${CUT(CUT(MESSAGE(to),@,1),:,2)})
 same => n,Set(EXTENSION_FROM=${CUT(CUT(MESSAGE(from),@,1),:,2)})
 same => n,Set(NUMBER_FROM=${EXTENSION_FROM})
 same => n,Set(ACTUAL_FROM=${EXTENSION_FROM} <sip:__VOIPMS_SIP_USER__@__VOIPMS_SIP_SERVER__>)
 same => n,Set(ACTUAL_TO=pjsip:__VOIPMS_TRUNK_NAME__/sip:${NUMBER_TO}@__VOIPMS_SIP_SERVER__)
 same => n,MessageSend(${ACTUAL_TO},${ACTUAL_FROM})
 same => n,NoOp(Send status is ${MESSAGE_SEND_STATUS})
 same => n,Hangup()
