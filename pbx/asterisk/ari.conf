; ═══════════════════════════════════════════════════════════════════
; Zeus — ARI (Asterisk REST Interface) user for the Customer Portal
;
; Converged into /etc/asterisk/ari.conf (NOT a *_custom.conf) on every
; apply by pbx/bootstrap-zeus-pbx.sh via pbx/asterisk_converge.py: the
; [<user>] section replaces wholesale, while [general] and any other
; products' ARI users (e.g. capstone's [dograh] on a shared PBX) pass
; through untouched.
;
; Why not ari_custom.conf: on the FreePBX builds both platforms ship,
; /etc/asterisk/ari.conf is a PLAIN file (not a module-managed symlink)
; and contains NO `#include ari_custom.conf` — so a user written to
; ari_custom.conf is never read by Asterisk. The section therefore lives
; in the file Asterisk actually reads, and converge refreshes it
; idempotently on every apply.
;
; Secrets come from pbx.env (FREEPBX_ARI_USER / FREEPBX_ARI_SECRET) and
; are rendered at apply time — this file is never committed with real
; values (__ARI_USER__ / __ARI_SECRET__ placeholders).
; ═══════════════════════════════════════════════════════════════════

[__ARI_USER__]
type = user
password = __ARI_SECRET__
read_only = no
password_format = plain

; ═══════════════════════════════════════════════════════════════════
; AVA's own ARI user is deliberately NOT rendered here.
;
; ari.conf `#include`s ari_additional_custom.conf, and that is where the
; [AVA_ARI_USER] section lives. Emitting it in BOTH files makes Asterisk
; reject the whole file — sorcery refuses a config with a duplicate
; object, so ONE duplicate user costs EVERY ARI user:
;
;   ERROR res_sorcery_config.c: Config file 'ari.conf' could not be
;   loaded; configuration contains a duplicate object: 'zeus-ava'
;
; The resulting 401 is indistinguishable from a wrong password until you
; read that line, and it only appears on a fresh Asterisk start — a
; reload keeps serving the users already in memory, so the fault is
; invisible until the next container recreate. One owner per user.
; ═══════════════════════════════════════════════════════════════════
