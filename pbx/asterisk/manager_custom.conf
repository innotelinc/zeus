; ═══════════════════════════════════════════════════════════════════
; Zeus — AMI (Asterisk Manager Interface) user for the Customer Portal
; FreePBX include file: /etc/asterisk/manager_custom.conf
;
; Applies via:  pbx/bootstrap-zeus-pbx.sh
; Secrets come from pbx.env (FREEPBX_AMI_USER / FREEPBX_AMI_SECRET) —
; this file is rendered at apply time, never committed with real values.
; ═══════════════════════════════════════════════════════════════════

[__AMI_USER__]
secret = __AMI_SECRET__
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
; The portal runs with host networking and connects to AMI on this host's LAN
; IP, so the permit is the LAN subnet only — never a docker bridge range
; (172.16.0.0/12, 172.31.0.0/16). AMI_PERMIT overrides it; pbx.env.example.
__AMI_PERMIT__
read = system,call,log,verbose,command,agent,user,config,dtmf,reporting,cdr,dialplan,message
write = system,call,log,verbose,command,agent,user,config,dtmf,reporting,cdr,dialplan,originate,message