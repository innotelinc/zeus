; RTP media port range for the Zeus shared voice plane.
;
; Zeus owns the RTP plane: every consumer (Zeus softphones, the portal, and the
; Capstone agent add-on) rides this one range. Capstone's pbx/ layer mirrors
; this file byte-for-byte in shape so a shared box runs one RTP plane, not two.
;
; This file is the SOURCE that docker-entrypoint-full.sh writes into the
; container's /etc/asterisk/rtp_custom.conf on every boot (and that
; scripts/setup.sh writes on bare-metal installs). The entrypoint rewrites the
; runtime copy canonically (stunaddr/icesupport + rtpstart/rtpend from
; FREEPBX_RTP_PORT_START..END, default 10101-10120) so it always matches what
; the freepbx service in docker-compose.full.yml publishes and the router
; forwards.
;
; NOTE: on FreePBX (Asterisk 22), config reads are first-wins, so an included
; file cannot override the generated rtp_additional.conf. The durable fix is
; the kvstore_Sipsettings write in docker-entrypoint-full.sh, which makes
; fwconsole regenerate rtp_additional.conf with these values. This file stays
; as the canonical fallback for images/versions where last-wins applies.
;
; STUN and TURN are two different servers here, and that is deliberate.
;
;   TURN  = the local coturn (same compose network, service name `coturn`, or
;           this host's LAN IP :3478). Asterisk relays media through it for
;           ICE/WebRTC peers behind NAT. It speaks RFC 5766 with
;           MESSAGE-INTEGRITY and works — set it with PJSIP_STUN_TURN_ADDR
;           (bare metal: the coturn/TURN host, e.g. 127.0.0.1); the port
;           follows TURN_LISTENING_PORT.
;
;   STUN  = a server Asterisk's *discovery* client can actually talk to, set
;           with PJSIP_STUN_ADDR. Asterisk's STUN client (main/stun.c) is
;           RFC 3489: a 16-byte transaction id and no RFC 5389 magic cookie.
;           coturn is RFC 5389 and, as that RFC requires, silently drops a
;           datagram that is not a STUN message — no reply, nothing in its log
;           — so a stunaddr pointed at coturn discovered nothing and cost
;           3x3s of retries on *every* call (the recurring "stun.c: Attempt 3
;           to send STUN request ... timed out"). coturn does ship a deprecated
;           --rfc3489-compatibility, but this estate runs it with --no-stun, so
;           the two addresses cannot be the same server. The default below
;           answers both generations and returns
;           MAPPED-ADDRESS (0x0001), the one attribute the legacy client reads;
;           an empty PJSIP_STUN_ADDR disables discovery.
;
; Both rows live in the generated rtp_additional.conf, which FreePBX rewrites on
; every Apply Config — and rewrites *wrong*: Sipsettings::genConfig() runs the
; RTP values through strtolower(), which destroys a case-sensitive TURN password
; and made coturn answer "credentials are incorrect" once per call. That is what
; pbx/rtp_settings_guard.py re-asserts after each reload. See pbx/README.md.
;
; (Do not use host.docker.internal here — Asterisk's ast_sockaddr_resolve fails
; on that alias and silently disables STUN.)
[general]
stunaddr = stun.l.google.com:19302
icesupport = yes
rtpstart=10101
rtpend=10120
