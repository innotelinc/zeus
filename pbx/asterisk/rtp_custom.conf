; RTP media port range for the Zeus shared voice plane.
;
; Zeus owns the RTP plane: every consumer (Zeus softphones, the portal, and the
; Capstone agent add-on) rides this one range. Capstone's pbx/ layer mirrors
; this file byte-for-byte in shape so a shared box runs one RTP plane, not two.
;
; This file is the SOURCE that docker-entrypoint-full.sh writes into the
; container's /etc/asterisk/rtp_custom.conf on every boot (and that
; scripts/setup.sh writes on bare-metal installs). The entrypoint rewrites the
; runtime copy canonically (stunaddr/icesupport + rtpstart/rtpend from
; FREEPBX_RTP_PORT_START..END, default 10101-10120) so it always matches what
; the freepbx service in docker-compose.full.yml publishes and the router
; forwards.
;
; NOTE: on FreePBX (Asterisk 22), config reads are first-wins, so an included
; file cannot override the generated rtp_additional.conf. The durable fix is
; the kvstore_Sipsettings write in docker-entrypoint-full.sh, which makes
; fwconsole regenerate rtp_additional.conf with these values. This file stays
; as the canonical fallback for images/versions where last-wins applies.
;
; STUN/TURN point at the local coturn (same compose network, service name
; `coturn` :3478) so Asterisk's RTP engine can discover its external address
; (STUN) and relay media through TURN for ICE/WebRTC peers behind NAT.
; Override the address with PJSIP_STUN_TURN_ADDR (bare-metal: set it to the
; coturn/TURN host, e.g. 127.0.0.1); the port follows TURN_LISTENING_PORT.
; (Do not use host.docker.internal here — Asterisk's ast_sockaddr_resolve fails
; on that alias and silently disables STUN.)
[general]
stunaddr = coturn:3478
icesupport = yes
rtpstart=10101
rtpend=10120
