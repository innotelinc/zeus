; ═══════════════════════════════════════════════════════════════════
; Zeus — ARI (Asterisk REST Interface) user for the Customer Portal
; FreePBX include file: /etc/asterisk/ari_custom.conf
;
; Applies via:  pbx/bootstrap-zeus-pbx.sh
; Secrets come from pbx.env (FREEPBX_ARI_USER / FREEPBX_ARI_SECRET).
; ═══════════════════════════════════════════════════════════════════

[__ARI_USER__]
type = user
password = __ARI_SECRET__
read_only = no
password_format = plain