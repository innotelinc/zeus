; ═══════════════════════════════════════════════════════════════════
; Zeus — AVA (first-response voice agent) ARI user
;
; Target: /etc/asterisk/ari_additional_custom.conf
;
; Why this file and not ari.conf: on the FreePBX builds this stack ships,
; /etc/asterisk/ari.conf is a SYMLINK into the arimanager module
; (-> /var/www/html/admin/modules/arimanager/etc/ari.conf), and the module
; regenerates ari_additional.conf on every Apply Config. ari.conf does
; `#include ari_additional_custom.conf`, so this file is both read by
; Asterisk and left alone by the module — which is where the shared voice
; plane already keeps Capstone's [dograh] user.
;
; Converge merges per section, so Zeus's AVA user and Capstone's dograh user
; coexist on one PBX and neither can clobber the other.
;
; Rendered at apply time from AVA_ARI_USER / AVA_ARI_SECRET (pbx.env); the
; secret is never committed.
; ═══════════════════════════════════════════════════════════════════

[__AVA_ARI_USER__]
type = user
password = __AVA_ARI_SECRET__
read_only = no
password_format = plain
