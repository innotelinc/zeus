; ═══════════════════════════════════════════════════════════════════
; Zeus — portal dialplan (FreePBX include file: extensions_custom.conf)
;
; The portal owns call routing for customer accounts: extensions live in
; [from-zeus-portal] and route through AMI originate / ARI stasis so the
; portal can screen, record and hand calls to the softphone. This file is
; the static scaffold; pbx/bootstrap-zeus-pbx.sh reconciles it and the
; setup.sh installer leaves the PBX portal-ready (AMI, ARI, WSS, OAuth2).
;
; Inbound DIDs are NOT routed from here. Every platform DID points at a
; Dograh workflow directly (a FreePBX inbound route to `dograh-inbound,80NN`),
; so the DID table is the routing authority and nothing in this file needs to
; exist per account. See docs/unified-console.md §5.
; ═══════════════════════════════════════════════════════════════════

; Customer softphone extensions (created per account by the portal via AMI).
; Range mirrored by the portal config — keep in sync with ASTERISK_* env.
;
; THIS CONTEXT MUST DEFINE NO PATTERN THAT MATCHES A DIALLED NUMBER.
;
; [from-internal-custom] includes it, and FreePBX's generated [from-internal]
; includes that BEFORE the module-generated contexts — the outbound routes among
; them. A pattern here is therefore consulted before any route, so one that
; matches a dialled number swallows the call before the route (and its digit
; normalisation) is ever reached. A placeholder `exten => _Z.` did exactly that:
; `Z` is any digit 1-9 and `.` is one-or-more, so it matched every ordinary
; number a phone dials and ran NoOp then Hangup — outbound calls never reached
; the trunk and did not complete, while the trunk stayed registered and every
; other check stayed green. Measured live: dialling 4134210134 logged
; `Executing [4134210134@from-internal:1] NoOp("PJSIP/…", "Zeus portal
; extension 4134210134")` then `Hangup()`, never `outrt-*`.
;
; Portal softphone extensions are added as explicit `exten => <ext>,1,…` lines
; (their own numbers, not a wildcard), so an empty context is not only correct
; here, it is required. Nothing may be added above an outbound route's reach.
[from-zeus-portal]

; Route inbound DID hits for portal accounts to the portal context.
[from-internal-custom]
include => from-zeus-portal
