; ═══════════════════════════════════════════════════════════════════
; Zeus — portal dialplan (FreePBX include file: extensions_custom.conf)
;
; The portal owns call routing for customer accounts: extensions live in
; [from-zeus-portal] and route through AMI originate / ARI stasis so the
; portal can screen, record and hand calls to the softphone. This file is
; the static scaffold; pbx/bootstrap-zeus-pbx.sh reconciles it and the
; setup.sh installer leaves the PBX portal-ready (AMI, ARI, WSS, OAuth2).
; ═══════════════════════════════════════════════════════════════════

; Customer softphone extensions (created per account by the portal via AMI).
; Range mirrored by the portal config — keep in sync with ASTERISK_* env.
[from-zeus-portal]
; placeholder — portal accounts are added dynamically; this context is the
; dialplan anchor for the softphone PJSIP endpoints.
exten => _Z.,1,NoOp(Zeus portal extension ${EXTEN})
same  => n,Hangup()

; Route inbound DID hits for portal accounts to the portal context.
[from-internal-custom]
include => from-zeus-portal

; ═══════════════════════════════════════════════════════════════════
; AVA — first response for every inbound call
;
; Point every inbound route at the Custom Destination
;   zeus-ai-router,s,1
; The router dispatches per DID: [zeus-ai-accounts] — rendered by
; pbx/ava_routing.py from the live accounts, one entry per DID — sets that
; account's agent and whether the Capstone add-on is live, and anything
; unmatched falls through to the default agent.
;
; Doing the dispatch here rather than in per-route FreePBX variables keeps
; one owner for the decision, and makes it testable without a PBX.
;
; Channel variables the router may set before Stasis (the D2 envelope, stamped
; per entry by pbx/ava_routing.py — see docs/ava-capstone-convergence.md):
;   AI_CALL_ID=${UNIQUEID}       the trace id the whole call carries
;   AI_CONTEXT_TOKEN=${UNIQUEID} handle for /api/voice/context/{token}: account,
;                                plan, prior calls. A pointer, not a secret —
;                                the read authenticates with a credential
;   AI_ACCOUNT=<portal user id>  which account this DID belongs to
;   AI_CALLER_NUM, AI_CALLER_NAME  who is calling
;   AI_AGENT=<agent slug>        which AVA agent answers (default: receptionist)
;   AI_AUDIO_PROFILE=<profile>   audio profile override
;   AI_PROVIDER=<provider>       provider/pipeline override (e.g. zeus_premium)
;   ZEUS_CAPSTONE_ADDON=0|1      account holds the Capstone add-on
;   ZEUS_CAPSTONE_TARGET=<exten> WHICH interview it reaches (empty = none)
; ═══════════════════════════════════════════════════════════════════
[zeus-ai-router]
exten => s,1,NoOp(Zeus AI router for ${FROM_DID})
same  => n,GotoIf($["${DIALPLAN_EXISTS(zeus-ai-accounts,${FROM_DID},1)}"="1"]?zeus-ai-accounts,${FROM_DID},1)
same  => n,Goto(zeus-ai-first-response,s,1)

[zeus-ai-first-response]
; Default the agent: an unset AI_AGENT must still land on an agent, because
; AVA v7.4+ routing is agent-only and fails closed (a missing agent drops
; the call rather than falling back to a prompt).
exten => s,1,NoOp(Zeus AI first response)
same  => n,Set(AI_AGENT=${IF($["${AI_AGENT}"=""]?receptionist:${AI_AGENT})})
same  => n,Stasis(asterisk-ai-voice-agent)
; A returned call means AVA released the channel (hangup or a transfer
; that could not complete) — end it rather than falling into an
; unmatched-extension error.
same  => n,Hangup()
exten => _X.,1,Goto(s,1)

; ═══════════════════════════════════════════════════════════════════
; AVA — handoff destinations (the only destinations an agent may reach)
;
; An agent's transfer tools are scoped to this context. Its catch-all
; refuses anything else on purpose: an agent that invents an extension
; number must not be able to dial it. Add destinations here — never widen
; the catch-all.
;
; A destination here is an ENTRY POINT, not a target: what 824 reaches is
; decided per account in [zeus-ai-interview] below. That is what makes an
; interview workflow a portal change rather than an engine-tool change.
; ═══════════════════════════════════════════════════════════════════
[zeus-ai-handoff]
; Capstone interview agent (the Capstone add-on). The same 824 is named by the
; engine's transfer inventory (config/ava/ai-agent.yaml) and classified by
; src/lib/handoff.ts — three files, one contract, so this is the extension that
; must not change.
exten => 824,1,NoOp(Zeus AI handoff -> Capstone interview agent)
same  => n,Goto(zeus-ai-interview,s,1)

; Add-on refused (or an unknown destination): never drop a caller silently.
; Route to the operator when the PBX has one, otherwise say so and end.
exten => refused,1,NoOp(Zeus AI refused destination - Capstone add-on not enabled)
same  => n,GotoIf($["${DIALPLAN_EXISTS(from-internal,0,1)}"="1"]?from-internal,0,1)
same  => n,Playback(ss-noservice)
same  => n,Hangup()

; Human fallback — the operator. FreePBX answers extension 0 from
; [from-internal]; if a PBX does not define it, say so instead of
; dumping the caller.
exten => 0,1,NoOp(Zeus AI handoff -> operator)
same  => n,GotoIf($["${DIALPLAN_EXISTS(from-internal,0,1)}"="1"]?from-internal,0,1)
same  => n,Playback(ss-noservice)
same  => n,Hangup()

; Refusal. Kept last so a literal destination above always wins.
exten => _X.,1,NoOp(Zeus AI refused transfer destination ${EXTEN})
same  => n,Goto(refused,1)

; ═══════════════════════════════════════════════════════════════════
; AVA — which interview workflow an account reaches
;
; The decision belongs to the account, not to the extension an agent dials,
; so it lives in a context of its own: AVA's transfer inventory names 824,
; the router stamps ZEUS_CAPSTONE_TARGET from the account's Capstone binding
; (pbx/ava_routing.py, from voice_bindings), and what that binding names is
; reached here. A replacement for the constant "824 → dograh-inbound,8000",
; which reached whatever that one extension happened to be.
; ═══════════════════════════════════════════════════════════════════
[zeus-ai-interview]
exten => s,1,NoOp(Zeus AI interview handoff for ${FROM_DID})
; The Capstone add-on gate. The router stamps ZEUS_CAPSTONE_ADDON=1 only for
; accounts holding the add-on, so an agent cannot hand a call to the
; interview product for an account that has not bought it — the enforcement
; is here in the dialplan, not in the prompt.
same  => n,GotoIf($["${ZEUS_CAPSTONE_ADDON}"="1"]?target,1:zeus-ai-handoff,refused,1)
; An empty target is a refusal, not a default. An account with no binding has
; no interview workflow, and "reaches whichever agent 8000 is" is the
; behaviour this replaces — it answered a caller as the wrong interview with
; nothing to show for it.
exten => target,1,GotoIf($["${ZEUS_CAPSTONE_TARGET}"=""]?zeus-ai-handoff,refused,1)
same  => n,GotoIf($["${DIALPLAN_EXISTS(dograh-inbound,${ZEUS_CAPSTONE_TARGET},1)}"="1"]?dograh-inbound,${ZEUS_CAPSTONE_TARGET},1)
; A binding that names a workflow this PBX does not carry is refused too, and
; never entered directly: Capstone's Stasis app name is dograh's own generated
; one (dograh_<hex>), so a literal Stasis() here would be a dialplan constant
; for an app that rotates — and the legacy bare "dograh" names an app no ARI
; client registers, which Asterisk falls through to Hangup() in silence.
; The dialplan references the context and extension that Capstone already
; converges, and lets the operator catch what it cannot resolve.
same  => n,Goto(zeus-ai-handoff,refused,1)

; ═══════════════════════════════════════════════════════════════════
; AVA — the way back from Capstone
;
; A concluded interview that needs a human should not be a cold transfer to a
; ring group with no explanation, so an interview product hands the channel
; back here, with the ingress envelope (AI_CALL_ID, AI_ACCOUNT) still on it —
; one call rather than two — and an AI_AGENT for whoever continues it.
;
; Nothing calls this yet: Capstone's own [dograh-inbound] returns to its
; voicemail fallback today and has to be pointed here. Until it is, this
; context is inert, which is why it can be converged ahead of that change.
; ═══════════════════════════════════════════════════════════════════
[zeus-ai-return]
exten => s,1,NoOp(Zeus AI interview return for ${FROM_DID})
; An unset AI_AGENT is not guessed at: AVA's routing is agent-only and fails
; closed, so a caller returning with no agent to answer them goes to the
; operator instead of to whichever agent the default happens to be.
same  => n,GotoIf($["${AI_AGENT}"!=""]?zeus-ai-first-response,s,1)
same  => n,GotoIf($["${DIALPLAN_EXISTS(from-internal,0,1)}"="1"]?from-internal,0,1)
same  => n,Playback(ss-noservice)
same  => n,Hangup()
exten => _X.,1,Goto(s,1)

; ── Per-account routing (generated) ──────────────────────────────────
; [zeus-ai-accounts] is rendered by pbx/ava_routing.py from the portal's
; accounts and converged into this file — do not hand-edit it here. Each
; entry sets the account's agent and whether the Capstone add-on is live,
; then hands the call to the same first-response flow. Kept empty in the
; repo so a fresh PBX answers with the default agent.
[zeus-ai-accounts]
exten => s,1,NoOp(Zeus AI accounts placeholder)
same  => n,Goto(zeus-ai-first-response,s,1)