; ═══════════════════════════════════════════════════════════════════
; Zeus — Asterisk HTTP server + WebSocket transport (WebRTC softphone)
; FreePBX include file: /etc/asterisk/http_custom.conf
;
; Applies via:  pbx/bootstrap-zeus-pbx.sh
; The portal's WebRTC softphone connects over WSS (ws.zeus.innotel.us →
; :8089 TLS terminated at the edge; Asterisk listens on 8088 plain).
; ═══════════════════════════════════════════════════════════════════

[general]
enabled = yes
bindaddr = 0.0.0.0
bindport = __ARI_HTTP_PORT__
enablestatic = yes
; enable the WebSocket transport for SIP.js / WebRTC
websocket = yes