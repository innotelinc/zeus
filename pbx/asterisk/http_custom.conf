; ═══════════════════════════════════════════════════════════════════
; Zeus — Asterisk HTTP server + WebSocket transport (WebRTC softphone)
; FreePBX include file: /etc/asterisk/http_custom.conf
;
; Applies via:  pbx/bootstrap-zeus-pbx.sh
; The portal's WebRTC softphone connects over WSS (ws.zeus.innotel.us →
; :8089 TLS terminated at the edge; Asterisk listens on 8088 plain).
; ═══════════════════════════════════════════════════════════════════

[general]
enabled = yes
bindaddr = 0.0.0.0
bindport = __ARI_HTTP_PORT__
; enablestatic is deliberately NOT set here. FreePBX's http module already
; owns [general] in http_additional.conf (which http_custom.conf is included
; after) and ships enablestatic=no; overriding it to yes makes Asterisk serve
; its static tree, which nothing in this stack needs — the ARI/WebRTC plane is
; a websocket, not static content. Stating it here only added a second owner.
; enable the WebSocket transport for SIP.js / WebRTC
websocket = yes