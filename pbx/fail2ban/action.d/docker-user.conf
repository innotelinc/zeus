# Fail2ban action — ban an address in Docker's DOCKER-USER chain.
#
# Why not the stock actions: every PBX port here is *published* by Docker
# (5060/udp, 5061/tcp, 8088, 8089, 5038, RTP). A published port is DNAT'd to
# the container and its packets then traverse the FORWARD path — Docker inserts
# `-j DOCKER-USER` as the first rule of FORWARD, before its own conntrack
# accepts. A ban inserted into INPUT (what iptables/iptables-multiport do) never
# sees those packets, so the scanner keeps hammering Asterisk while fail2ban
# cheerfully reports it as banned.
#
# DOCKER-USER is the documented hook for exactly this: an admin-managed chain
# Docker never flushes. Inserting at position 1 means the DROP is evaluated
# before Docker's accept rules and before conntrack lets an established flow
# through, so a 48h ban is a 48h ban for every port on the host, not just SIP.
#
# The chain exists as soon as the Docker daemon has started. If it is missing
# (daemon down), actioncheck fails and the jail refuses to start rather than
# silently accepting traffic — fail-closed.

[Definition]

actionstart =

actionstop =

actioncheck = iptables -w -n -L DOCKER-USER >/dev/null 2>&1

# Insert only when absent. Two jails can ban the same address (a scanner hits
# both `No matching endpoint found` and `InvalidPassword`), and a blind -I would
# stack identical rules — unban then removes one copy and leaves the host still
# dropping that address. `-C` first makes the action idempotent, so exactly one
# rule exists per banned address.
actionban = iptables -w -C DOCKER-USER -s <ip> -j DROP 2>/dev/null || iptables -w -I DOCKER-USER 1 -s <ip> -j DROP

actionunban = iptables -w -D DOCKER-USER -s <ip> -j DROP

[Init]
iptables = iptables
