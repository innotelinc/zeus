# Fail2ban filter — Asterisk/PJSIP security events.
#
# Asterisk emits one record per rejected SIP message to the `security` log
# channel (enabled by pbx/entrypoint-dograh.sh via logger.conf), written by
# res_security_log.c as a key/value body. Its shape is:
#
#   [2026-09-12 14:03:00] SECURITY[1234] res_security_log.c: SecurityEvent="InvalidPassword",
#   EventTV="2026-09-12T14:03:00.123-0400",Severity="Error",Service="PJSIP",
#   EventVersion="1",AccountID="6001",SessionID="0x7f...",LocalAddress="IPV4/UDP/192.168.1.46/5060",
#   RemoteAddress="IPV4/UDP/172.110.223.87/52144",...
#
# The address to ban is the IP inside RemoteAddress — the peer that sent the
# message. LocalAddress is this PBX and must never be the match.
#
# `SuccessfulAuth` is deliberately NOT in the list below: it is the event every
# *legitimate* registration produces. Banning on it would blackhole a working
# phone on its first packet.

[Definition]

failregex = ^\[[^\]]*\] SECURITY\[\d+\] res_security_log\.c: SecurityEvent="(?:InvalidPassword|ChallengeResponseFailed|InvalidAccountID|RequestNotAllowed|AuthMethodNotSupported|FailedACL|SessionTimeout)".*RemoteAddress="IPV4/(?:UDP|TCP)/<HOST>/\d+"

ignoreregex =
