# Fail2ban filter — rejected SIP requests in the Asterisk `full` log.
#
# The security log only carries records for messages Asterisk actually tried to
# identify. Scanner traffic that never matches an endpoint (`No matching
# endpoint found`) and the brute-force attempts that do (`Failed to
# authenticate`) both land in the `full` log, so this filter is the wider net —
# it is what catches a wave of random REGISTER/INVITE from a single host.
#
# Shape of the lines (res_pjsip/pjsip_distributor.c):
#
#   [...] NOTICE[1175] res_pjsip/pjsip_distributor.c: Request 'REGISTER' from
#   '<sip:6666@192.168.1.46>' failed for '5.39.57.91:61254' (callid:
#   47474286-...) - Failed to authenticate
#
# Note there are two addresses on the line and only one of them is the sender:
# the `from '<sip:user@host>'` address is attacker-chosen (it is often *our own*
# SIP address, used to look like a local caller), while the address after
# `failed for` is the real packet source with its source port. <HOST> therefore
# anchors on the `failed for` address only.

[Definition]

failregex = ^\[[^\]]*\] NOTICE\[\d+\] res_pjsip/pjsip_distributor\.c: Request '[^']*' from '[^']*' failed for '<HOST>:\d+' .* - Failed to authenticate
            ^\[[^\]]*\] NOTICE\[\d+\] res_pjsip/pjsip_distributor\.c: Request '[^']*' from '[^']*' failed for '<HOST>:\d+' .* - No matching endpoint found

ignoreregex =
