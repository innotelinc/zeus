# SigNoz otel-collector config for Zeus (clickhouse 25.4 topology).
# The collector ingests OTLP and writes DIRECTLY to ClickHouse (no hop through
# the query-service anymore). Traces go to signoz_traces, metrics to
# signoz_metrics. The schema is created by zeus-signoz-schema-migrator.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 1000
    timeout: 5s

exporters:
  clickhousetraces:
    datasource: tcp://zeus-signoz-clickhouse:9000/signoz_traces
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      queue_size: 100
      num_consumers: 5
  signozclickhousemetrics:
    dsn: tcp://zeus-signoz-clickhouse:9000/signoz_metrics

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhousetraces]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [signozclickhousemetrics]
