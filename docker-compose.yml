# ═══════════════════════════════════════════════════════════════
# Innotel PBX Portal — Docker Compose
# ═══════════════════════════════════════════════════════════════
# Deploys the PBX portal standalone (no Asterisk/FreePBX).
# Requires a running VoIP infrastructure on the network.
#
# Quick start:
#   cp .env.docker.example .env   # then fill in your values
#   docker compose up -d
#
# Demo login: demo@innotel.us / 8dpWR8wl4eYncm5v
# ═══════════════════════════════════════════════════════════════

services:
  pbx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pbx-portal
    restart: unless-stopped
    # AppArmor was removed from the host (apt purge), but the kernel LSM may
    # still be active — keep apparmor=unconfined so the docker-default profile
    # is not applied to this container.
    security_opt:
      - apparmor=unconfined
    ports:
      - "3000:3000"
    volumes:
      - pbx-data:/app/data
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Next binds to $HOSTNAME (set to the public IP in .env, or injected by
      # Docker as the container id) — pin it so the server listens on all
      # local interfaces (0.0.0.0) instead of failing with EADDRNOTAVAIL.
      - HOSTNAME=0.0.0.0
    healthcheck:
      # No `-f`: the health endpoint returns 503 when >=2 external services
      # (FreePBX/VoIP.ms/Stripe) are down. The container is healthy as long as
      # the portal itself responds — any HTTP response counts; only transport
      # errors (connection refused/timeout) fail the check.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - pbx-net

  # ─── Optional: Coturn TURN server for WebRTC softphone ─────
  # Uncomment if you need a TURN server for NAT traversal.
  # Set NEXT_PUBLIC_TURN_SERVER=turn:pbx-coturn:3478 in .env
  # coturn:
  #   image: coturn/coturn:latest
  #   container_name: pbx-coturn
  #   restart: unless-stopped
  #   ports:
  #     - "3478:3478"
  #     - "3478:3478/udp"
  #     - "5349:5349"
  #     - "5349:5349/udp"
  #   volumes:
  #     - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
  #   networks:
  #     - pbx-net

volumes:
  pbx-data:
    name: pbx-portal-data

networks:
  pbx-net:
    name: pbx-net
