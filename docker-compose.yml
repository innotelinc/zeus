# ═══════════════════════════════════════════════════════════════
# Zeus — VOIP Platform Portal — Docker Compose
# ═══════════════════════════════════════════════════════════════
# Deploys the Zeus portal standalone (no Asterisk/FreePBX).
# Requires a running VoIP infrastructure on the network.
#
# Quick start:
#   cp .env.docker.example .env   # then fill in your values
#   docker compose up -d
#
# Demo login: demo@zeus.innotel.us / 8dpWR8wl4eYncm5v
# ═══════════════════════════════════════════════════════════════

# Project name is pinned so container/volume names never depend on where this
# repo is checked out (the mesh puts it in 2-voice/zeus).
name: zeus

services:
  pbx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zeus-portal
    restart: unless-stopped
    # AppArmor was removed from the host (apt purge), but the kernel LSM may
    # still be active — keep apparmor=unconfined so the docker-default profile
    # is not applied to this container.
    security_opt:
      - apparmor=unconfined
    ports:
      - "3001:3000"                     # Zeus portal (3001 avoids conflict with capstone portal)
    volumes:
      - pbx-data:/app/data
      # This product's Vault token, read-only. Cerulean's Vault bootstrap mints
      # it (VAULT_PRODUCT_TOKENS=zeus there) and renews it in place; the stack
      # only ever reads it. See data/vault/token/ (gitignored).
      - ./data/vault/token:/vault/token:ro
    # Vault is published on the host, not on this compose network, so the
    # container reaches it through the bridge gateway alias (onyx's pattern).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Next binds to $HOSTNAME (set to the public IP in .env, or injected by
      # Docker as the container id) — pin it so the server listens on all
      # local interfaces (0.0.0.0) instead of failing with EADDRNOTAVAIL.
      - HOSTNAME=0.0.0.0
      # ── Session ──
      - SESSION_SECRET=${SESSION_SECRET:-}
      - SESSION_SECURE=${SESSION_SECURE:-false}
      - SESSION_SAMESITE=${SESSION_SAMESITE:-lax}
      - SESSION_DOMAIN=${SESSION_DOMAIN:-}
      # ── Auth mode ──
      # "authentik" = SSO only · "freepbx" = local password auth only ·
      # "both" = Authentik button + password form. Default: "authentik"
      # when the AUTHENTIK_* OIDC vars are set, "freepbx" otherwise.
      - AUTH_MODE=${AUTH_MODE:-}
      # ── FreePBX + AvantFax (the shared voice plane on pbx-net) ──
      # This portal joins the pinned pbx-net bridge, which Zeus's PBX container
      # sits on, so both are dialled by container name. The GUI's host :8083 is
      # loopback-only (it fronts pbx.<domain> through the pbx-sso gateway), so
      # no LAN address works here — and 8083 is Apache, not AMI, so none of the
      # Docker-subnet caveats attached to 5038 apply.
      - FREEPBX_URL=${FREEPBX_URL:-http://zeus-freepbx}
      - FREEPBX_CLIENT_ID=${FREEPBX_CLIENT_ID:-pbxportal-api}
      - FREEPBX_CLIENT_SECRET=${FREEPBX_CLIENT_SECRET:-}
      - AVANTFAX_URL=${AVANTFAX_URL:-http://zeus-freepbx/fax}
      # AvantFax's own DB, consumed by the fax module.
      - AVANTFAX_DB_PASS=${AVANTFAX_DB_PASS:-}
    healthcheck:
      # No `-f`: the health endpoint returns 503 when >=2 external services
      # (FreePBX/VoIP.ms/Stripe) are down. The container is healthy as long as
      # the portal itself responds — any HTTP response counts; only transport
      # errors (connection refused/timeout) fail the check.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    networks:
      - pbx-net

  # ── Coturn TURN server for WebRTC softphone (enabled by default) ──
  # Realm/credentials come from .env (TURN_USERNAME/TURN_CREDENTIAL/
  # TURN_REALM/TURN_EXTERNAL_IP); the softphone advertises the public
  # address coturn.zeus.innotel.us (DNS CNAME + edge proxy).
  coturn:
    image: coturn/coturn:latest
    container_name: pbx-coturn
    restart: unless-stopped
    # NB: only flags this image's turnserver actually accepts. `--no-dtls` is
    # rejected outright ("unrecognized option") and `--no-cli` is deprecated in
    # favour of `--cli`, so both made the container exit 255 in a restart loop
    # the first time anyone ran `docker compose up coturn`. docker-compose.full.yml
    # carries the same list — keep the two in step.
    command:
      - turnserver
      - --no-tls
      - --fingerprint
      - --lt-cred-mech
      - --user=${TURN_USERNAME:-turnuser}:${TURN_CREDENTIAL:?set TURN_CREDENTIAL in .env}
      - --realm=${TURN_REALM:-zeus.innotel.us}
      - --listening-port=3478
      - --min-port=${TURN_RELAY_PORT_START:-49152}
      - --max-port=${TURN_RELAY_PORT_END:-49251}
      - --listening-ip=0.0.0.0
      # Public address coturn advertises for relayed candidates. It sits behind
      # Docker NAT and cannot discover this itself. The coturn image eval()s
      # each argument and ships detect-external-ip (a DNS probe returning the
      # caller's public IP), so a changing WAN IP is tracked on every start —
      # which matters here: 73.68.203.71 is residential, and a pinned address
      # rots into relay candidates nobody can reach (calls connect, no audio).
      # Pin TURN_EXTERNAL_IP in .env only where that probe is blocked. Same
      # expression as the Capstone coturn service, so handing the voice plane
      # back changes nothing.
      - --external-ip=${TURN_EXTERNAL_IP:-$(detect-external-ip)}
      - --log-file=stdout
      - --simple-log
    ports:
      - "${TURN_LISTENING_PORT:-3478}:3478"
      - "${TURN_LISTENING_PORT:-3478}:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
      # The relay range has to be published: 3478 alone only carries the TURN
      # control channel. Relayed media is delivered to a relayed transport
      # address inside 49152-49251, so without this mapping every peer outside
      # pbx-net — i.e. every real browser — sends into a closed port and calls
      # are silent. Capstone published it; this service initially did not, so
      # the relay went dark the moment Zeus took over port 3478.
      - "${TURN_RELAY_PORT_START:-49152}-${TURN_RELAY_PORT_END:-49251}:${TURN_RELAY_PORT_START:-49152}-${TURN_RELAY_PORT_END:-49251}/udp"
    # The image ships bash but no curl/wget/python, so a raw TCP connect is the
    # proof the TURN listener is up — a dead relay then shows in `compose ps`
    # instead of being discovered by a silent user.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3478' || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - pbx-net

  # ═══════════════════════════════════════════════════════════════════
  # AVA — first-response AI voice agent (the `voice` profile)
  #
  # Answers every inbound DID: greeting, IVR, business functions,
  # blind/attended transfers, and the handoff into Capstone's interview
  # agent. See docs/ava-integration.md for why AVA fronts the calls and
  # Capstone (dograh) stays behind the handoff.
  #
  #   1. bash scripts/fetch-ava.sh          # clone AVA at the pinned commit
  #   2. docker compose --profile voice up -d
  #
  # Profile-gated on purpose: these services build AVA from ./vendor/ava,
  # so a portal-only host (no AVA checkout) must still be able to run a
  # plain `docker compose up`.
  # ═══════════════════════════════════════════════════════════════════

  # The engine that answers calls. Host networking is required rather than
  # cosmetic: Asterisk lives inside the FreePBX container and must dial the
  # engine back for AudioSocket media, and ARI is bound to the host's LAN
  # address (192.168.1.30:8088). Neither leg is expressible with published
  # ports.
  ai-engine:
    profiles: ["voice"]
    build:
      context: ${AVA_SRC:-./vendor/ava}
      dockerfile: Dockerfile
      args:
        ASTERISK_GID: ${ASTERISK_GID:-995}
    image: zeus-ava-engine:${AVA_VERSION:-v7.6.1}
    container_name: zeus-ava-engine
    restart: unless-stopped
    network_mode: host
    environment:
      # ARI. The user is AVA's own (pbx/asterisk/ari.conf renders it from
      # AVA_ARI_USER/AVA_ARI_SECRET) — the portal's ARI user is separate.
      - ASTERISK_HOST=${AVA_ASTERISK_HOST:-192.168.1.30}
      - ASTERISK_ARI_PORT=${AVA_ASTERISK_ARI_PORT:-8088}
      - ASTERISK_ARI_USERNAME=${AVA_ARI_USER:-zeus-ava}
      - ASTERISK_ARI_PASSWORD=${AVA_ARI_SECRET:-}
      # Reasoning goes to the estate's canonical gateway, never to a
      # cloud API directly.
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY:-}
      # AVA enforces an env-only secret contract (src/config/security.py,
      # inject_provider_api_keys): for every provider block it recognises it
      # sets the inline key from the matching environment variable, and STRIPS
      # the inline value when that variable is unset. So an
      # `api_key: "${OMNIROUTE_API_KEY}"` written in the YAML is deleted before
      # the pipeline resolves and the engine falls back to a placeholder
      # adapter — logging only "requires an API key", with no hint that the
      # key it wants is this one. `openai` is AVA's name for the OpenAI wire
      # format, and a block named `openai` belongs to the OPENAI_API_KEY
      # family, so the gateway key has to arrive under that name. The YAML
      # keeps only the base_url and model that point the wire format at
      # OmniRoute.
      - OPENAI_API_KEY=${OMNIROUTE_API_KEY:-}
      - AVA_LLM_BASE_URL=${AVA_LLM_BASE_URL:-http://192.168.1.46:20129/v1}
      - AVA_LLM_MODEL=${AVA_LLM_MODEL:-gemini/gemini-3.1-flash-lite}
      # On-box speech (local_ai_server) — the pipeline's STT/TTS.
      - LOCAL_WS_URL=${LOCAL_WS_URL:-ws://127.0.0.1:8765}
      - LOCAL_WS_CHUNK_MS=${LOCAL_WS_CHUNK_MS:-320}
      - LOCAL_WS_CONNECT_TIMEOUT=${LOCAL_WS_CONNECT_TIMEOUT:-2.0}
      - LOCAL_WS_RESPONSE_TIMEOUT=${LOCAL_WS_RESPONSE_TIMEOUT:-5.0}
      # Address Asterisk is told to dial for AudioSocket. Must be an address
      # that resolves to this host FROM INSIDE the FreePBX container.
      - AVA_ENGINE_ADVERTISE_HOST=${AVA_ENGINE_ADVERTISE_HOST:-192.168.1.30}
      # NOTE: AudioSocket's port is NOT set here. The engine applies
      # AUDIOSOCKET_PORT with setdefault, so the YAML's audiosocket.port wins
      # either way — set it in config/ava/ai-agent.yaml (currently 8097,
      # because another product on this host holds 8090 on loopback).
      - HEALTH_BIND_HOST=0.0.0.0
      - HEALTH_BIND_PORT=${AVA_HEALTH_PORT:-15000}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - TZ=${TZ:-America/New_York}
      - PYTHONUNBUFFERED=1
    volumes:
      # Runtime config, seeded from the tracked template by fetch-ava.sh and
      # then editable by the admin UI. Kept out of the repo so an operator
      # edit does not show up as a diff against config/ava/ai-agent.yaml.
      - ./data/ava/project/config/ai-agent.yaml:/app/config/ai-agent.yaml:ro
      # agents.db lives here and is shared with the admin UI (it is the
      # routing source of truth: AVA v7.4+ is agent-only and fails closed).
      - ./data/ava/data:/app/data
      - ./data/ava/models:/app/models
      - ava-media:/mnt/asterisk_media
    healthcheck:
      # NOT curl: the engine image is python-slim and ships no curl, so a
      # `curl -f` check reported the engine unhealthy forever (FailingStreak 54)
      # while it was in fact serving calls — a healthcheck that can never pass
      # is worse than none, because it hides a real failure later. urllib is
      # always present.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:${AVA_HEALTH_PORT:-15000}/metrics', timeout=5).status == 200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # AVA's operator API + console. The Zeus portal proxies it server-side
  # (src/lib/ava.ts) and owns the account-level gating, so this port is
  # published on loopback only: exposing the engine's admin API on the LAN
  # would put agent prompts and call transcripts on the wire.
  ai-engine-admin:
    profiles: ["voice"]
    build:
      context: ${AVA_SRC:-./vendor/ava}
      dockerfile: admin_ui/Dockerfile
    image: zeus-ava-admin:${AVA_VERSION:-v7.6.1}
    container_name: zeus-ava-admin
    restart: unless-stopped
    environment:
      - PROJECT_ROOT=/app/project
      # Signs the admin session tokens the portal obtains on login. AVA's own
      # default is a PUBLISHED dev placeholder, so this must be set — but it is
      # required, not enforced with ${VAR:?}: compose interpolates the whole
      # file regardless of the active profile, and a `:?` here would make even
      # `docker compose up` (the portal-only deployment) fail before it starts.
      # scripts/fetch-ava.sh refuses to prepare a voice deployment without it,
      # which is the documented path.
      - JWT_SECRET=${AVA_ADMIN_JWT_SECRET:-}
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=8000
      - TZ=${TZ:-America/New_York}
      - ASTERISK_HOST=${AVA_ASTERISK_HOST:-192.168.1.30}
      - ASTERISK_ARI_USERNAME=${AVA_ARI_USER:-zeus-ava}
      - ASTERISK_ARI_PASSWORD=${AVA_ARI_SECRET:-}
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY:-}
    volumes:
      # PROJECT_ROOT: config/ai-agent.yaml + config/users.json + .env.
      # Writable — this is where the admin UI persists agent and config edits.
      - ./data/ava/project:/app/project
      # The admin backend imports the ENGINE's packages as `src.*` (api/config.py,
      # api/calls.py, agents_migration.py and others put PROJECT_ROOT on sys.path
      # precisely so it can). Its own image copies the admin backend to /app and
      # only a single flattened file out of src/, so without this the container
      # dies at import with "ModuleNotFoundError: No module named 'src'". Mounted
      # read-only: it borrows the engine's code, it never owns it.
      - ${AVA_SRC:-./vendor/ava}/src:/app/project/src:ro
      - ./data/ava/data:/app/data
      - ./data/ava/models:/app/models
      # NOTE: AVA's shipped compose also mounts /var/run/docker.sock so its
      # console can start/stop containers. That is root-equivalent host
      # access, so it is deliberately NOT mounted here; the Zeus portal is
      # the operator console. Compose an opt-in override if you want it.
    ports:
      - "127.0.0.1:${AVA_ADMIN_PORT:-8770}:8000"
    depends_on:
      - ai-engine

  # On-box STT/TTS for the zeus_hybrid pipeline. Slow to start — models load
  # at boot — but it is what keeps caller audio on the premises.
  #
  # Defaults match the pipeline this estate actually runs: Vosk STT + Piper
  # TTS, and no local LLM (reasoning goes to the LAN gateway, so llama.cpp
  # would only add a torch-sized image). A GPU host can trade quality for the
  # build by enabling Kokoro and Faster-Whisper:
  #   INCLUDE_KOKORO=true INCLUDE_FASTER_WHISPER=true docker compose \
  #     --profile voice build local-ai-server
  local-ai-server:
    profiles: ["voice"]
    build:
      context: ${AVA_SRC:-./vendor/ava}/local_ai_server
      dockerfile: Dockerfile
      args:
        - INCLUDE_VOSK=${INCLUDE_VOSK:-true}
        - INCLUDE_SHERPA=${INCLUDE_SHERPA:-false}
        - INCLUDE_FASTER_WHISPER=${INCLUDE_FASTER_WHISPER:-false}
        - INCLUDE_WHISPER_CPP=${INCLUDE_WHISPER_CPP:-false}
        - INCLUDE_PIPER=${INCLUDE_PIPER:-true}
        - INCLUDE_KOKORO=${INCLUDE_KOKORO:-false}
        - INCLUDE_LLAMA=${INCLUDE_LLAMA:-false}
    image: zeus-ava-local-ai:${AVA_VERSION:-v7.6.1}
    container_name: zeus-ava-local-ai
    restart: unless-stopped
    network_mode: host
    environment:
      - LOCAL_STT_BACKEND=${LOCAL_STT_BACKEND:-vosk}
      - LOCAL_TTS_BACKEND=${LOCAL_TTS_BACKEND:-piper}
      # Loopback, not 0.0.0.0. Both consumers (the engine and the admin API)
      # are host-networked, so 127.0.0.1 reaches this server and nothing else
      # does — the server's own guard refuses to bind a non-loopback address
      # without LOCAL_WS_AUTH_TOKEN, and it is right to: speech would otherwise
      # be served to anything on the LAN. Binding loopback satisfies the guard
      # by making the exposure impossible rather than by adding a secret.
      - LOCAL_WS_HOST=127.0.0.1
      - LOCAL_WS_PORT=${LOCAL_WS_PORT:-8765}
      - LOCAL_WS_AUTH_TOKEN=${LOCAL_WS_AUTH_TOKEN:-}
      # The server's built-in defaults name models it does not ship
      # (vosk-model-en-us-0.22 is the 1.8 GB model). These point at what
      # scripts/fetch-ava-models.sh actually downloads for an 8-core CPU box.
      - LOCAL_STT_MODEL_PATH=${LOCAL_STT_MODEL_PATH:-/app/models/stt/vosk-model-small-en-us-0.15}
      - LOCAL_TTS_MODEL_PATH=${LOCAL_TTS_MODEL_PATH:-/app/models/tts/en_US-lessac-medium.onnx}
      - TZ=${TZ:-America/New_York}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data/ava/models:/app/models
      - ./data/ava/data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket;socket.create_connection(('127.0.0.1',${LOCAL_WS_PORT:-8765}),3)\" || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ── OmniRoute: single AI model gateway for the entire stack ──────────
  # All subsystems (Capstone, Rizzaura, Atlas, AthenIQ) point here.
  #
  # Profile-gated: the CANONICAL gateway for the estate runs on 192.168.1.46
  # (published through the oauth2-proxy door on :20129), and every consumer
  # here — the portal, AVA, Capstone — points at that one. Starting this
  # service would create a second, empty gateway on :20128 that answers
  # anonymously and holds none of the provider connections, which is exactly
  # the drift that made "the gateway" ambiguous. Enable deliberately with
  # `docker compose --profile gateway up -d omniroute`.
  omniroute:
    profiles: ["gateway"]
    image: ${OMNIROUTE_IMAGE:-diegosouzapw/omniroute:latest}
    container_name: zeus-omniroute
    restart: unless-stopped
    # Memory posture (docs/service-audit.md): the gateway buffers model
    # streams; cap it (measured ~0.5 GiB steady) so it never crowds the PBX.
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      OMNIROUTE_JWT_SECRET: "${OMNIROUTE_JWT_SECRET:-change-me-jwt-secret}"
      OMNIROUTE_API_KEY_SECRET: "${OMNIROUTE_API_KEY_SECRET:-change-me-api-key-secret}"
      OMNIROUTE_INITIAL_PASSWORD: "${OMNIROUTE_INITIAL_PASSWORD:-change-me-admin-password}"
    ports:
      - "${OMNIROUTE_PORT:-20128}:${OMNIROUTE_PORT:-20128}"
    volumes:
      - omniroute-data:/data
    networks:
      - pbx-net

volumes:
  pbx-data:
    name: zeus-portal-data
  # AudioSocket/ExternalMedia scratch space shared with the PBX container.
  ava-media:
  omniroute-data:

networks:
  pbx-net:
    name: pbx-net
